<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>电商产品图任务表单</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f4;
      --surface: #ffffff;
      --surface-alt: #f1f3ef;
      --text: #1c1f1d;
      --muted: #667069;
      --border: #d9ded8;
      --focus: #2563eb;
      --accent: #0f766e;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 650;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 17px;
      line-height: 1.2;
      font-weight: 650;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    form {
      display: grid;
      gap: 16px;
    }

    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field[hidden] {
      display: none;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label,
    legend {
      font-weight: 600;
      color: var(--text);
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
    }

    textarea {
      min-height: 84px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus,
    button:focus {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    fieldset {
      grid-column: 1 / -1;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin: 0;
    }

    .checks {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      background: var(--surface-alt);
      font-weight: 500;
    }

    .check input {
      width: 16px;
      min-height: 16px;
    }

    .actions {
      position: sticky;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0 0;
      background: linear-gradient(to top, var(--bg) 80%, rgba(247, 247, 244, 0));
    }

    button {
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      padding: 8px 14px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button.secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--border);
    }

    button.compact {
      justify-self: start;
    }

    .status {
      min-height: 40px;
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      background: var(--surface);
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .status.ok {
      border-color: #94d3a2;
      color: #166534;
      background: #f0fdf4;
    }

    .status.error {
      border-color: #f0a8a1;
      color: var(--danger);
      background: #fff5f5;
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 820px) {
      main {
        padding: 16px;
      }

      header,
      .actions {
        display: grid;
      }

      .grid,
      .checks {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>电商产品图任务表单</h1>
        <p>填写后点击保存，小星保证把信息原封不动传递到codex~</p>
      </div>
    </header>

    <form id="taskForm">
      <section aria-labelledby="productTitle">
        <h2 id="productTitle">产品信息</h2>
        <div class="grid">
          <div class="field full">
            <label for="bulkProductInfo">大段产品信息识别/拆分</label>
            <textarea id="bulkProductInfo" name="bulkProductInfo" placeholder="可粘贴产品资料、规格说明、包装信息、卖点等文本。点击按钮后仅把能识别出的内容填入空字段。"></textarea>
            <button class="secondary compact" type="button" id="splitProductInfo">识别并填入空字段</button>
            <p class="hint">只按关键词做确定性拆分，不会编造缺失信息，也不会覆盖你已填写的字段。</p>
          </div>
          <div class="field">
            <label for="productName">产品名称</label>
            <input id="productName" name="productName" autocomplete="off">
          </div>
          <div class="field">
            <label for="brand">品牌</label>
            <input id="brand" name="brand" autocomplete="off">
          </div>
          <div class="field">
            <label for="category">商品类目</label>
            <input id="category" name="category" autocomplete="off">
          </div>
          <div class="field">
            <label for="material">材质/成分</label>
            <input id="material" name="material" autocomplete="off">
          </div>
          <div class="field">
            <label for="sizeSpec">尺寸/规格</label>
            <input id="sizeSpec" name="sizeSpec" autocomplete="off">
          </div>
          <div class="field">
            <label for="colorVariant">颜色/款式</label>
            <input id="colorVariant" name="colorVariant" autocomplete="off">
          </div>
          <div class="field full">
            <label for="packageList">包装清单</label>
            <textarea id="packageList" name="packageList"></textarea>
          </div>
          <div class="field">
            <label for="targetUsers">适用人群</label>
            <textarea id="targetUsers" name="targetUsers"></textarea>
          </div>
          <div class="field">
            <label for="useScenarios">使用场景</label>
            <textarea id="useScenarios" name="useScenarios"></textarea>
          </div>
          <div class="field">
            <label for="sellingPoints">核心卖点</label>
            <textarea id="sellingPoints" name="sellingPoints"></textarea>
          </div>
          <div class="field">
            <label for="avoidExpressions">需要避免的表达</label>
            <textarea id="avoidExpressions" name="avoidExpressions"></textarea>
          </div>
          <div class="field">
            <label for="additionalNotes">其他补充</label>
            <textarea id="additionalNotes" name="additionalNotes"></textarea>
          </div>
          <div class="field">
            <label for="productInfoPath">产品信息文档路径</label>
            <input id="productInfoPath" name="productInfoPath" autocomplete="off">
          </div>
        </div>
      </section>

      <section aria-labelledby="taskTitle">
        <h2 id="taskTitle">任务选项</h2>
        <div class="grid">
          <div class="field">
            <label for="countryLanguage">目标国家/语言</label>
            <select id="countryLanguage" name="countryLanguage" required>
              <option value="">请选择</option>
              <option value="US_EN">美国 / 英语</option>
              <option value="MX_ES">墨西哥 / 西班牙语</option>
              <option value="CL_ES">智利 / 西班牙语</option>
              <option value="CO_ES">哥伦比亚 / 西班牙语</option>
              <option value="ZA_EN">南非 / 英语</option>
              <option value="OTHER">其他</option>
            </select>
          </div>
          <div class="field" id="countryLanguageOtherField" hidden>
            <label for="countryLanguageOther">其他国家/语言</label>
            <input id="countryLanguageOther" name="countryLanguageOther" autocomplete="off">
          </div>
          <div class="field">
            <label for="platform">目标平台</label>
            <select id="platform" name="platform" required>
              <option value="">请选择</option>
              <option value="Amazon">Amazon</option>
              <option value="MercadoLibre">MercadoLibre</option>
              <option value="Takealot">Takealot</option>
              <option value="OTHER">其他</option>
            </select>
          </div>
          <div class="field" id="platformOtherField" hidden>
            <label for="platformOther">其他平台</label>
            <input id="platformOther" name="platformOther" autocomplete="off">
          </div>
          <div class="field">
            <label for="knowledgeStyle">knowledge style</label>
            <select id="knowledgeStyle" name="knowledgeStyle" required>
              <option value="">请选择</option>
              <option value="style1">style1</option>
              <option value="style2">style2</option>
              <option value="style3">style3</option>
              <option value="style4">style4</option>
              <option value="style5">style5</option>
              <option value="style6">style6</option>
              <option value="stylehero">stylehero</option>
            </select>
          </div>
          <fieldset>
            <legend>图片类型</legend>
            <p class="hint">可多选；勾选“全选”会自动选择全部标准类型。</p>
            <div class="checks">
              <label class="check"><input type="checkbox" id="selectAllTypes"> 全选</label>
              <label class="check"><input type="checkbox" name="imageTypes" value="Hero"> Hero</label>
              <label class="check"><input type="checkbox" name="imageTypes" value="Selling"> Selling</label>
              <label class="check"><input type="checkbox" name="imageTypes" value="Feature"> Feature</label>
              <label class="check"><input type="checkbox" name="imageTypes" value="Specs"> Specs</label>
              <label class="check"><input type="checkbox" name="imageTypes" value="Lifestyle"> Lifestyle</label>
              <label class="check"><input type="checkbox" name="imageTypes" value="Value"> Value</label>
              <label class="check"><input type="checkbox" name="imageTypes" value="Compare"> Compare</label>
              <label class="check"><input type="checkbox" name="imageTypes" value="Closing"> Closing</label>
              <label class="check"><input type="checkbox" name="imageTypes" value="CoreA"> CoreA</label>
              <label class="check"><input type="checkbox" name="imageTypes" value="CoreB"> CoreB</label>
              <label class="check"><input type="checkbox" name="imageTypes" value="Guide"> Guide</label>
              <label class="check"><input type="checkbox" name="imageTypes" value="OTHER"> 其他</label>
            </div>
          </fieldset>
          <div class="field full" id="imageTypesOtherField" hidden>
            <label for="imageTypesOther">其他图片类型</label>
            <input id="imageTypesOther" name="imageTypesOther" autocomplete="off">
          </div>
          <div class="field">
            <label for="ratio">图片比例</label>
            <select id="ratio" name="ratio" required>
              <option value="">请选择</option>
              <option value="1:1" selected>1:1</option>
              <option value="4:5">4:5</option>
              <option value="3:4">3:4</option>
              <option value="16:9">16:9</option>
              <option value="9:16">9:16</option>
            </select>
          </div>
          <div class="field">
            <label for="quantityPerType">每类数量</label>
            <select id="quantityPerType" name="quantityPerType" required>
              <option value="">请选择</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="4">4</option>
              <option value="6">6</option>
              <option value="10">10</option>
            </select>
          </div>
          <div class="field">
            <label for="extraRequirementMode">额外生图要求</label>
            <select id="extraRequirementMode" name="extraRequirementMode">
              <option value="none">无额外要求</option>
              <option value="custom">填写额外要求</option>
            </select>
          </div>
          <div class="field" id="extraRequirementsField" hidden>
            <label for="extraRequirements">额外要求内容</label>
            <textarea id="extraRequirements" name="extraRequirements"></textarea>
          </div>
        </div>
      </section>

      <div class="actions">
        <button type="submit">保存表单</button>
        <button class="secondary" type="reset">清空</button>
        <div id="status" class="status" role="status">尚未保存。</div>
      </div>
    </form>
  </main>

  <script>
    const form = document.querySelector("#taskForm");
    const statusEl = document.querySelector("#status");
    const countryLanguage = document.querySelector("#countryLanguage");
    const countryLanguageOtherField = document.querySelector("#countryLanguageOtherField");
    const countryLanguageOther = document.querySelector("#countryLanguageOther");
    const platform = document.querySelector("#platform");
    const platformOtherField = document.querySelector("#platformOtherField");
    const platformOther = document.querySelector("#platformOther");
    const ratio = document.querySelector("#ratio");
    const extraRequirementMode = document.querySelector("#extraRequirementMode");
    const extraRequirementsField = document.querySelector("#extraRequirementsField");
    const extraRequirements = document.querySelector("#extraRequirements");
    const imageTypesOtherField = document.querySelector("#imageTypesOtherField");
    const imageTypesOther = document.querySelector("#imageTypesOther");
    const bulkProductInfo = document.querySelector("#bulkProductInfo");
    const splitProductInfo = document.querySelector("#splitProductInfo");
    const selectAllTypes = document.querySelector("#selectAllTypes");
    const imageTypeInputs = Array.from(document.querySelectorAll("input[name='imageTypes']"));

    function setStatus(message, kind = "") {
      statusEl.textContent = message;
      statusEl.className = `status ${kind}`.trim();
    }

    function fieldValue(name) {
      return new FormData(form).get(name)?.toString().trim() || "";
    }

    function selectedImageTypes() {
      return imageTypeInputs
        .filter((input) => input.checked)
        .map((input) => input.value);
    }

    function buildPayload() {
      return {
        productInfo: {
          productName: fieldValue("productName"),
          brand: fieldValue("brand"),
          category: fieldValue("category"),
          material: fieldValue("material"),
          sizeSpec: fieldValue("sizeSpec"),
          colorVariant: fieldValue("colorVariant"),
          packageList: fieldValue("packageList"),
          targetUsers: fieldValue("targetUsers"),
          useScenarios: fieldValue("useScenarios"),
          sellingPoints: fieldValue("sellingPoints"),
          avoidExpressions: fieldValue("avoidExpressions"),
          additionalNotes: fieldValue("additionalNotes"),
          productInfoPath: fieldValue("productInfoPath")
        },
        taskOptions: {
          countryLanguage: fieldValue("countryLanguage"),
          countryLanguageOther: fieldValue("countryLanguageOther"),
          platform: fieldValue("platform"),
          platformOther: fieldValue("platformOther"),
          knowledgeStyle: fieldValue("knowledgeStyle"),
          imageTypes: selectedImageTypes(),
          imageTypesOther: fieldValue("imageTypesOther"),
          ratio: fieldValue("ratio"),
          quantityPerType: Number(fieldValue("quantityPerType") || 0),
          extraRequirementMode: fieldValue("extraRequirementMode") || "none",
          extraRequirements: fieldValue("extraRequirements")
        },
        meta: {
          schemaVersion: 1
        }
      };
    }

    function setFieldHidden(wrapper, input, hidden) {
      wrapper.hidden = hidden;
      if (hidden && input) {
        input.value = "";
      }
    }

    function updateConditionalFields() {
      setFieldHidden(
        countryLanguageOtherField,
        countryLanguageOther,
        countryLanguage.value !== "OTHER"
      );
      setFieldHidden(platformOtherField, platformOther, platform.value !== "OTHER");
      setFieldHidden(
        imageTypesOtherField,
        imageTypesOther,
        !imageTypeInputs.some((input) => input.value === "OTHER" && input.checked)
      );
      setFieldHidden(
        extraRequirementsField,
        extraRequirements,
        extraRequirementMode.value !== "custom"
      );
    }

    function fillEmptyField(fieldName, value) {
      const input = form.elements[fieldName];
      const normalized = value.trim();
      if (!input || !normalized || input.value.trim()) {
        return false;
      }
      input.value = normalized;
      return true;
    }

    function splitProductText() {
      const text = bulkProductInfo.value.trim();
      if (!text) {
        setStatus("请先粘贴需要识别的产品信息。", "error");
        return;
      }

      const fieldPatterns = [
        ["productName", /(?:产品名称|品名|商品名称|名称)[:：]\s*([^\n\r]+)/i],
        ["brand", /(?:品牌|Brand)[:：]\s*([^\n\r]+)/i],
        ["category", /(?:商品类目|类目|分类|Category)[:：]\s*([^\n\r]+)/i],
        ["material", /(?:材质|成分|材料|Material)[:：]\s*([^\n\r]+)/i],
        ["sizeSpec", /(?:尺寸|规格|型号|Size|Spec)[:：]\s*([^\n\r]+)/i],
        ["colorVariant", /(?:颜色|款式|Color|Variant)[:：]\s*([^\n\r]+)/i],
        ["packageList", /(?:包装清单|包装|配件|内含|Package)[:：]\s*([^\n\r]+)/i],
        ["targetUsers", /(?:适用人群|人群|用户|Target users?)[:：]\s*([^\n\r]+)/i],
        ["useScenarios", /(?:使用场景|场景|用途|Use cases?)[:：]\s*([^\n\r]+)/i],
        ["sellingPoints", /(?:核心卖点|卖点|亮点|优势|Selling points?)[:：]\s*([^\n\r]+)/i],
        ["avoidExpressions", /(?:需要避免的表达|避免表达|禁用词|Avoid)[:：]\s*([^\n\r]+)/i],
        ["additionalNotes", /(?:其他补充|补充|备注|Notes?)[:：]\s*([^\n\r]+)/i],
        ["productInfoPath", /(?:产品信息文档路径|文档路径|资料路径|Path)[:：]\s*([^\n\r]+)/i]
      ];

      let filled = 0;
      fieldPatterns.forEach(([fieldName, pattern]) => {
        const match = text.match(pattern);
        if (match && fillEmptyField(fieldName, match[1])) {
          filled += 1;
        }
      });

      if (filled > 0) {
        setStatus(`已识别并填入 ${filled} 个空字段。`, "ok");
      } else {
        setStatus("未识别到“字段名：内容”格式的信息，已保持现有字段不变。", "error");
      }
    }

    countryLanguage.addEventListener("change", () => {
      if (countryLanguage.value === "MX_ES") {
        platform.value = "MercadoLibre";
      } else if (countryLanguage.value === "ZA_EN") {
        platform.value = "Takealot";
      } else {
        platform.value = "";
      }
      updateConditionalFields();
    });

    platform.addEventListener("change", updateConditionalFields);
    extraRequirementMode.addEventListener("change", updateConditionalFields);
    splitProductInfo.addEventListener("click", splitProductText);

    selectAllTypes.addEventListener("change", () => {
      imageTypeInputs
        .filter((input) => input.value !== "OTHER")
        .forEach((input) => {
          input.checked = selectAllTypes.checked;
        });
    });

    imageTypeInputs.forEach((input) => {
      input.addEventListener("change", () => {
        const standardInputs = imageTypeInputs.filter((item) => item.value !== "OTHER");
        selectAllTypes.checked = standardInputs.every((item) => item.checked);
        updateConditionalFields();
      });
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const payload = buildPayload();
      if (payload.taskOptions.imageTypes.length === 0) {
        setStatus("请至少选择一种图片类型。", "error");
        return;
      }

      setStatus("正在保存...");
      try {
        const response = await fetch("/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (!response.ok || !result.ok) {
          throw new Error(result.message || result.error || "保存失败");
        }
        setStatus(`小星已经记住所有信息啦~接下来的事儿包在小星身上！时间：${result.savedAt}`, "ok");
      } catch (error) {
        setStatus(`保存失败：${error.message}`, "error");
      }
    });

    form.addEventListener("reset", () => {
      window.setTimeout(() => {
        ratio.value = "1:1";
        updateConditionalFields();
        setStatus("尚未保存。");
      }, 0);
    });

    updateConditionalFields();
  </script>
</body>
</html>
